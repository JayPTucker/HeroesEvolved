// Flight acceleration with a villager and a pig, photographed in an isolated world.
allprojects {
    plugins.withId('net.neoforged.moddev') {
        afterEvaluate {
            def preview = sourceSets.create('flightCarryPreview') {
                java.srcDir('src/uitest/java')
                compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
                runtimeClasspath += sourceSets.main.runtimeClasspath
            }
            neoForge {
                mods { heroesevolved { sourceSet(preview) } }
                runs {
                    client {
                        gameDirectory = project.file('build/flight-carry-preview')
                        programArguments.addAll('--width', '1100', '--height', '800')
                        systemProperty('heroes.preview.flightCarry', 'true')
                    }
                }
            }
            tasks.named('runClient') { dependsOn(tasks.named('flightCarryPreviewClasses')) }
            apply from: rootProject.file('tools/preview-result.gradle')
        }
    }
}

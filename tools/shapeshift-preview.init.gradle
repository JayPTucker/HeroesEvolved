// Shapeshifting phase 1: the client morphs into several forms and captures each one.
allprojects {
    plugins.withId('net.neoforged.moddev') {
        afterEvaluate {
            def preview = sourceSets.create('shapeshiftPreview') {
                java.srcDir('src/uitest/java')
                compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
                runtimeClasspath += sourceSets.main.runtimeClasspath
            }
            neoForge {
                mods { heroesevolved { sourceSet(preview) } }
                runs {
                    client {
                        gameDirectory = project.file('build/shapeshift-preview')
                        programArguments.addAll('--width', '1100', '--height', '800')
                        systemProperty('heroes.preview.shapeshift', 'true')
                    }
                }
            }
            tasks.named('runClient') { dependsOn(tasks.named('shapeshiftPreviewClasses')) }
        }
    }
}

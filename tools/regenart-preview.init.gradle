// Regeneration (RegenArt): Regrowth in the veins, Mending, Blood Gift, Second Life, revive, reckless, Last One Standing. Never bundled into the mod JAR.
allprojects {
    plugins.withId('net.neoforged.moddev') {
        afterEvaluate {
            def preview = sourceSets.create('regenArtPreview') {
                java.srcDir('src/uitest/java')
                compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
                runtimeClasspath += sourceSets.main.runtimeClasspath
            }
            neoForge {
                mods { heroesevolved { sourceSet(preview) } }
                runs {
                    client {
                        gameDirectory = project.file('build/regenart-preview')
                        programArguments.addAll('--width', '1200', '--height', '800')
                        systemProperty('heroes.preview.regenart', 'true')
                    }
                }
            }
            tasks.named('runClient') { dependsOn(tasks.named('regenArtPreviewClasses')) }
            apply from: rootProject.file('tools/preview-result.gradle')
        }
    }
}

// Focused fighting-style regressions (FightingStylesGameTests); tests never enter the released mod.
allprojects {
    plugins.withId('net.neoforged.moddev') {
        afterEvaluate {
            def tests = sourceSets.create('fightingTest') {
                java.srcDir('src/gametest/java')
                java.include('com/jayptucker/heroesevolved/combat/FightingStylesGameTests.java')
                resources.srcDir('src/gametest/resources')
                compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
                runtimeClasspath += sourceSets.main.runtimeClasspath
            }
            neoForge {
                mods { heroesevolved { sourceSet(tests) } }
                runs { gameTestServer { gameDirectory = project.file('build/fighting-test-world') } }
            }
            tasks.named('runGameTestServer') {
                dependsOn(tasks.named('fightingTestClasses'))
                def world = project.file('build/fighting-test-world/world')
                def config = project.file('build/fighting-test-world/config/heroesevolved-common.toml')
                doFirst { world.deleteDir(); config.delete() }
            }
        }
    }
}

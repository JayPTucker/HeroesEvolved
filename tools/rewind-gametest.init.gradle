// Load test sources only for this verification run, not into the released mod.
allprojects {
    plugins.withId('net.neoforged.moddev') {
      afterEvaluate {
        def rewindTests = sourceSets.create('rewindGameTest') {
            java.srcDir('src/gametest/java')
            resources.srcDir('src/gametest/resources')
            compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
            runtimeClasspath += sourceSets.main.runtimeClasspath
        }
        neoForge {
            mods {
                heroesevolved {
                    sourceSet(rewindTests)
                }
            }
            runs {
                gameTestServer {
                    gameDirectory = project.file('build/rewind-gametest-world')
                }
            }
        }
        tasks.named('runGameTestServer') {
            dependsOn(tasks.named('rewindGameTestClasses'))
            // Every run starts from a fresh world, so saved data (like an already-built bunker) never leaks between runs,
            // and from the mod's default config, as on GitHub: a value left over from an old local run (a forward speed
            // of 15 once made every Skyburst test fail here and nowhere else) must not decide what passes.
            def staleWorld = project.file('build/rewind-gametest-world/world')
            def staleConfig = project.file('build/rewind-gametest-world/config/heroesevolved-common.toml')
            doFirst { staleWorld.deleteDir(); staleConfig.delete() }
        }
      }
    }
}

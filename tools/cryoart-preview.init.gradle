// Cryokinesis in one palette (CryoArt): Ice Blast, the frost effects, Prison, Whiteout, Sculpt, the skater, Absolute Zero. Never bundled into the mod JAR.
allprojects {
    plugins.withId('net.neoforged.moddev') {
        afterEvaluate {
            def preview = sourceSets.create('cryoArtPreview') {
                java.srcDir('src/uitest/java')
                compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
                runtimeClasspath += sourceSets.main.runtimeClasspath
            }
            neoForge {
                mods { heroesevolved { sourceSet(preview) } }
                runs {
                    client {
                        gameDirectory = project.file('build/cryoart-preview')
                        programArguments.addAll('--width', '1200', '--height', '800')
                        systemProperty('heroes.preview.cryoart', 'true')
                    }
                }
            }
            tasks.named('runClient') { dependsOn(tasks.named('cryoArtPreviewClasses')) }
            apply from: rootProject.file('tools/preview-result.gradle')
        }
    }
}

// Photographs the actual formation, pocket arena, aerial attacks and every phase. Never ships.
allprojects {
    plugins.withId('net.neoforged.moddev') {
        afterEvaluate {
            def preview=sourceSets.create('witherPreview') {
                java.srcDir('src/uitest/java')
                compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
                runtimeClasspath += sourceSets.main.runtimeClasspath
            }
            neoForge {
                mods { heroesevolved { sourceSet(preview) } }
                runs { client {
                    gameDirectory=project.file('build/wither-preview')
                    programArguments.addAll('--width','1400','--height','1000')
                    systemProperty('heroes.preview.wither','true')
                } }
            }
            tasks.named('runClient') { dependsOn(tasks.named('witherPreviewClasses')) }
            apply from: rootProject.file('tools/preview-result.gradle')
        }
    }
}

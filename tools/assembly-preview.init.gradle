// Matter Assembly, the engineer: the Matter orbit, Panels, ricochets, Launch Pads, Kaleidoscope, Sentinels, Skywalk. Never bundled into the mod JAR.
allprojects {
    plugins.withId('net.neoforged.moddev') {
        afterEvaluate {
            def preview = sourceSets.create('assemblyPreview') {
                java.srcDir('src/uitest/java')
                compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
                runtimeClasspath += sourceSets.main.runtimeClasspath
            }
            neoForge {
                mods { heroesevolved { sourceSet(preview) } }
                runs {
                    client {
                        gameDirectory = project.file('build/assembly-preview')
                        programArguments.addAll('--width', '1200', '--height', '800')
                        systemProperty('heroes.preview.assembly', 'true')
                    }
                }
            }
            tasks.named('runClient') { dependsOn(tasks.named('assemblyPreviewClasses')) }
            apply from: rootProject.file('tools/preview-result.gradle')
        }
    }
}

// The Watchmaker: Sylar's boss fight in his clock shop, photographed phase by phase. Never bundled into the mod JAR.
allprojects {
    plugins.withId('net.neoforged.moddev') {
        afterEvaluate {
            def preview = sourceSets.create('watchmakerPreview') {
                java.srcDir('src/uitest/java')
                compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
                runtimeClasspath += sourceSets.main.runtimeClasspath
            }
            neoForge {
                mods { heroesevolved { sourceSet(preview) } }
                runs {
                    client {
                        gameDirectory = project.file('build/watchmaker-preview')
                        programArguments.addAll('--width', '1100', '--height', '800')
                        systemProperty('heroes.preview.watchmaker', 'true')
                    }
                }
            }
            tasks.named('runClient') { dependsOn(tasks.named('watchmakerPreviewClasses')) }
        }
    }
}

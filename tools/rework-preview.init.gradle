// Tempest, a standing tornado, Matter Assembly and Starfall, photographed. Never bundled into the mod JAR.
allprojects {
    plugins.withId('net.neoforged.moddev') {
        afterEvaluate {
            def preview = sourceSets.create('reworkPreview') {
                java.srcDir('src/uitest/java')
                compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
                runtimeClasspath += sourceSets.main.runtimeClasspath
            }
            neoForge {
                mods { heroesevolved { sourceSet(preview) } }
                runs {
                    client {
                        gameDirectory = project.file('build/rework-preview')
                        programArguments.addAll('--width', '1100', '--height', '800')
                        systemProperty('heroes.preview.rework', 'true')
                        systemProperty('heroes.preview.rework.tempestOnly', System.getProperty('tempestOnly', 'false'))
                    }
                }
            }
            tasks.named('runClient') { dependsOn(tasks.named('reworkPreviewClasses')) }
        }
    }
}

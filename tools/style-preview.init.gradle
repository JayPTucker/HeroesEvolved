// Every class ability set piece photographed on a stage in a flat world. Never bundled into the mod JAR.
allprojects {
    plugins.withId('net.neoforged.moddev') {
        afterEvaluate {
            def preview = sourceSets.create('stylePreview') {
                java.srcDir('src/uitest/java')
                compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
                runtimeClasspath += sourceSets.main.runtimeClasspath
            }
            neoForge {
                mods { heroesevolved { sourceSet(preview) } }
                runs {
                    client {
                        gameDirectory = project.file('build/style-preview')
                        programArguments.addAll('--width', '1280', '--height', '720')
                        systemProperty('heroes.preview.styles', 'true')
                    }
                }
            }
            tasks.named('runClient') { dependsOn(tasks.named('stylePreviewClasses')) }
        }
    }
}

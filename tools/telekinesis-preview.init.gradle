// Telekinesis, the far hand: Shove, Grip, Bullet Catch, Disarm, the Storm, Pin, Juggle, Skyfall, Levitate, classes. Never bundled into the mod JAR.
allprojects {
    plugins.withId('net.neoforged.moddev') {
        afterEvaluate {
            def preview = sourceSets.create('telekinesisPreview') {
                java.srcDir('src/uitest/java')
                compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
                runtimeClasspath += sourceSets.main.runtimeClasspath
            }
            neoForge {
                mods { heroesevolved { sourceSet(preview) } }
                runs {
                    client {
                        gameDirectory = project.file('build/telekinesis-preview')
                        programArguments.addAll('--width', '1200', '--height', '800')
                        systemProperty('heroes.preview.telekinesis', 'true')
                    }
                }
            }
            tasks.named('runClient') { dependsOn(tasks.named('telekinesisPreviewClasses')) }
            apply from: rootProject.file('tools/preview-result.gradle')
        }
    }
}

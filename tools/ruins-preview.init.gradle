// Story ruins photographed with their terrain processor in a normal world. Never bundled into the mod JAR.
allprojects {
    plugins.withId('net.neoforged.moddev') {
        afterEvaluate {
            def preview = sourceSets.create('ruinsPreview') {
                java.srcDir('src/uitest/java')
                compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
                runtimeClasspath += sourceSets.main.runtimeClasspath
            }
            neoForge {
                mods { heroesevolved { sourceSet(preview) } }
                runs {
                    client {
                        gameDirectory = project.file('build/ruins-preview')
                        programArguments.addAll('--width', '1100', '--height', '800')
                        systemProperty('heroes.preview.ruins', 'true')
                        systemProperty('heroes.preview.ruins.ocean', providers.gradleProperty('ocean').isPresent().toString())
                    }
                }
            }
            tasks.named('runClient') { dependsOn(tasks.named('ruinsPreviewClasses')) }
            apply from: rootProject.file('tools/preview-result.gradle')
        }
    }
}

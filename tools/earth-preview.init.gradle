// The client photographs Density's earthbending with uitest/EarthPreview: Horse Stance, Rock Strike, Earth Shackle,
// pillars and walls, the Rising Mountain, Tiger and Crane, the tree, the classes, Rock Clap, first person and the Root
// ring, into build/earth-preview/screenshots/.
allprojects {
    plugins.withId('net.neoforged.moddev') {
        afterEvaluate {
            def preview = sourceSets.create('earthPreview') {
                java.srcDir('src/uitest/java')
                compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
                runtimeClasspath += sourceSets.main.runtimeClasspath
            }
            neoForge {
                mods { heroesevolved { sourceSet(preview) } }
                runs {
                    client {
                        gameDirectory = project.file('build/earth-preview')
                        programArguments.addAll('--width', '1100', '--height', '800')
                        systemProperty('heroes.preview.earth', 'true')
                    }
                }
            }
            tasks.named('runClient') { dependsOn(tasks.named('earthPreviewClasses')) }
            // Pass when every scene ran, not on the exit code the closing halt leaves.
            apply from: rootProject.file('tools/preview-result.gradle')
        }
    }
}

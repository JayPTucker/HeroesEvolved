// Photographs one blueprint in a flat world. Never bundled into the mod JAR.
//   ./gradlew runClient --init-script tools/blueprint-preview.init.gradle -Pblueprint=bunker_chamber [-Pcut=3]
// Screenshots land in build/blueprint-preview/screenshots/<name>-<view>.png
allprojects {
    plugins.withId('net.neoforged.moddev') {
        afterEvaluate {
            def preview = sourceSets.create('blueprintPreview') {
                java.srcDir('src/uitest/java')
                compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
                runtimeClasspath += sourceSets.main.runtimeClasspath
            }
            neoForge {
                mods { heroesevolved { sourceSet(preview) } }
                runs {
                    client {
                        gameDirectory = project.file('build/blueprint-preview')
                        programArguments.addAll('--width', '1100', '--height', '800')
                        systemProperty('heroes.preview.blueprint', project.findProperty('blueprint') ?: 'bunker_chamber')
                        systemProperty('heroes.preview.cut', (project.findProperty('cut') ?: '999').toString())
                    }
                }
            }
            tasks.named('runClient') { dependsOn(tasks.named('blueprintPreviewClasses')) }
        }
    }
}

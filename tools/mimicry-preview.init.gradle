// Empathic Mimicry (attunement, touch, switching and the memory wheel) photographed in a flat world. Never bundled into the mod JAR.
allprojects {
    plugins.withId('net.neoforged.moddev') {
        afterEvaluate {
            def preview = sourceSets.create('mimicryPreview') {
                java.srcDir('src/uitest/java')
                compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
                runtimeClasspath += sourceSets.main.runtimeClasspath
            }
            neoForge {
                mods { heroesevolved { sourceSet(preview) } }
                runs {
                    client {
                        gameDirectory = project.file('build/mimicry-preview')
                        programArguments.addAll('--width', '1100', '--height', '800')
                        systemProperty('heroes.preview.mimicry', 'true')
                    }
                }
            }
            tasks.named('runClient') { dependsOn(tasks.named('mimicryPreviewClasses')) }
        }
    }
}

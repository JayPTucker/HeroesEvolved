// The client photographs every shared-engine fighting style (Superspeed, Quake, Cryokinesis, Density, Regeneration, Force, Telekinesis) with uitest/HydroPreview.
allprojects {
    plugins.withId('net.neoforged.moddev') {
        afterEvaluate {
            def preview = sourceSets.create('fightingPreview') {
                java.srcDir('src/uitest/java')
                compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
                runtimeClasspath += sourceSets.main.runtimeClasspath
            }
            neoForge {
                mods { heroesevolved { sourceSet(preview) } }
                runs {
                    client {
                        gameDirectory = project.file('build/fighting-preview')
                        programArguments.addAll('--width', '1100', '--height', '800')
                        systemProperty('heroes.preview.fighting', 'true')
                        if (project.hasProperty('input')) systemProperty('heroes.preview.fighting.input', 'true')
                        if (project.hasProperty('only')) systemProperty('heroes.preview.fighting.only', project.property('only'))
                    }
                }
            }
            tasks.named('runClient') { dependsOn(tasks.named('fightingPreviewClasses')) }
            // Pass when the driver finished and its checks and photographs are sound, not on the halt's exit code.
            apply from: rootProject.file('tools/preview-result.gradle')
        }
    }
}

// Actual flame-flight controls and fire effects in an isolated flat preview world.
allprojects {
    plugins.withId('net.neoforged.moddev') {
        afterEvaluate {
            def preview = sourceSets.create('pyroPreview') {
                java.srcDir('src/uitest/java')
                java.include('com/jayptucker/heroesevolved/uitest/PyroPreview.java')
                compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
                runtimeClasspath += sourceSets.main.runtimeClasspath
            }
            neoForge {
                mods { heroesevolved { sourceSet(preview) } }
                runs { client {
                    gameDirectory = project.file('build/pyro-preview')
                    programArguments.addAll('--width', '1100', '--height', '800')
                    systemProperty('heroes.preview.pyro', 'true')
                    systemProperty('heroes.preview.pyro.skillsOnly', System.getProperty('heroes.preview.pyro.skillsOnly', 'false'))
                } }
            }
            tasks.named('runClient') { dependsOn(tasks.named('pyroPreviewClasses')) }
        }
    }
}

// Targeted Telepathy tests; test code is excluded from the release jar.
allprojects {
    plugins.withId('net.neoforged.moddev') {
        afterEvaluate {
            def tests = sourceSets.create('telepathyTest') {
                java.srcDir('src/gametest/java')
                java.include('com/jayptucker/heroesevolved/telepathy/**')
                resources.srcDir('src/gametest/resources')
                compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
                runtimeClasspath += sourceSets.main.runtimeClasspath
            }
            neoForge {
                mods { heroesevolved { sourceSet(tests) } }
                runs { gameTestServer { gameDirectory = project.file('build/telepathy-test-world') } }
            }
            tasks.named('runGameTestServer') { dependsOn(tasks.named('telepathyTestClasses')) }
        }
    }
}

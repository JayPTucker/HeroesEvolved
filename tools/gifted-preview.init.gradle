// Gifted mobs and village emergencies photographed (uitest/GiftedPreview). Never bundled into the mod JAR.
// ./gradlew runClient --init-script tools/gifted-preview.init.gradle  -> build/gifted-preview/screenshots/
allprojects {
    plugins.withId('net.neoforged.moddev') {
        afterEvaluate {
            def preview = sourceSets.create('giftedPreview') {
                java.srcDir('src/uitest/java')
                compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
                runtimeClasspath += sourceSets.main.runtimeClasspath
            }
            neoForge {
                mods { heroesevolved { sourceSet(preview) } }
                runs {
                    client {
                        gameDirectory = project.file('build/gifted-preview')
                        programArguments.addAll('--width', '1100', '--height', '800')
                        systemProperty('heroes.preview.gifted', 'true')
                    }
                }
            }
            tasks.named('runClient') { dependsOn(tasks.named('giftedPreviewClasses')) }
        }
    }
}

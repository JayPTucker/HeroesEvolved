// Photographs every Regeneration move, follow-up, skill and style (arm poses and RegenArt). Never bundled into the mod JAR.
allprojects {
    plugins.withId('net.neoforged.moddev') {
        afterEvaluate {
            def preview = sourceSets.create('regenKitPreview') {
                java.srcDir('src/uitest/java')
                compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
                runtimeClasspath += sourceSets.main.runtimeClasspath
            }
            neoForge {
                mods { heroesevolved { sourceSet(preview) } }
                runs {
                    client {
                        gameDirectory = project.file('build/regen-kit-preview')
                        programArguments.addAll('--width', '1100', '--height', '800')
                        systemProperty('heroes.preview.regenkit', 'true')
                    }
                }
            }
            tasks.named('runClient') { dependsOn(tasks.named('regenKitPreviewClasses')) }
        }
    }
}

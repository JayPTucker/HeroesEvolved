// Photographs every Sonic Resonance move, skill and style (arm poses and SonicArt). Never bundled into the mod JAR.
allprojects {
    plugins.withId('net.neoforged.moddev') {
        afterEvaluate {
            def preview = sourceSets.create('sonicKitPreview') {
                java.srcDir('src/uitest/java')
                compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
                runtimeClasspath += sourceSets.main.runtimeClasspath
            }
            neoForge {
                mods { heroesevolved { sourceSet(preview) } }
                runs {
                    client {
                        gameDirectory = project.file('build/sonic-kit-preview')
                        programArguments.addAll('--width', '1100', '--height', '800')
                        systemProperty('heroes.preview.sonickit', 'true')
                    }
                }
            }
            tasks.named('runClient') { dependsOn(tasks.named('sonicKitPreviewClasses')) }
        }
    }
}

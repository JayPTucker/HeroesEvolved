// A villager in meltdown: the glow, the safe point, the blast, and a speedster holding one in. Never bundled into the mod JAR.
allprojects {
    plugins.withId('net.neoforged.moddev') {
        afterEvaluate {
            def preview = sourceSets.create('meltdownPreview') {
                java.srcDir('src/uitest/java')
                compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
                runtimeClasspath += sourceSets.main.runtimeClasspath
            }
            neoForge {
                mods { heroesevolved { sourceSet(preview) } }
                runs {
                    client {
                        gameDirectory = project.file('build/meltdown-preview')
                        programArguments.addAll('--width', '1100', '--height', '800')
                        systemProperty('heroes.preview.meltdown', 'true')
                    }
                }
            }
            tasks.named('runClient') { dependsOn(tasks.named('meltdownPreviewClasses')) }
        }
    }
}

// Photographs every Quake move, follow-up, skill and style (arm poses and QuakeArt). Never bundled into the mod JAR.
allprojects {
    plugins.withId('net.neoforged.moddev') {
        afterEvaluate {
            def preview = sourceSets.create('quakeKitPreview') {
                java.srcDir('src/uitest/java')
                compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
                runtimeClasspath += sourceSets.main.runtimeClasspath
            }
            neoForge {
                mods { heroesevolved { sourceSet(preview) } }
                runs {
                    client {
                        gameDirectory = project.file('build/quake-kit-preview')
                        programArguments.addAll('--width', '1100', '--height', '800')
                        systemProperty('heroes.preview.quakekit', 'true')
                    }
                }
            }
            tasks.named('runClient') { dependsOn(tasks.named('quakeKitPreviewClasses')) }
        }
    }
}

// Focused radiation regression suite, including the first awakening and crater recovery.
allprojects {
    layout.buildDirectory.set(layout.projectDirectory.dir('build/radiation-test-runtime'))
    plugins.withId('net.neoforged.moddev') {
        afterEvaluate {
            def tests = sourceSets.create('radiationTest') {
                java.srcDir('src/gametest/java')
                java.include('com/jayptucker/heroesevolved/radiation/**')
                java.include('com/jayptucker/heroesevolved/*.java')
                resources.srcDir('src/gametest/resources')
                compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
                runtimeClasspath += sourceSets.main.runtimeClasspath
            }
            neoForge {
                mods { heroesevolved { sourceSet(tests) } }
                runs { gameTestServer { gameDirectory = project.file('build/radiation-test-world') } }
            }
            tasks.named('runGameTestServer') {
                dependsOn(tasks.named('radiationTestClasses'))
                def staleWorld = project.file('build/radiation-test-world/world')
                def staleConfig = project.file('build/radiation-test-world/config/heroesevolved-common.toml')
                doFirst { staleWorld.deleteDir(); staleConfig.delete() }
            }
        }
    }
}

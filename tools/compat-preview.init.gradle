// JEI and Jade with our content (uitest/CompatPreview). Never bundled into the mod JAR. -PnoJei -PnoJade run it without them.
allprojects {
    plugins.withId('net.neoforged.moddev') {
        afterEvaluate {
            def preview = sourceSets.create('compatPreview') {
                java.srcDir('src/uitest/java')
                compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
                runtimeClasspath += sourceSets.main.runtimeClasspath
            }
            neoForge {
                mods { heroesevolved { sourceSet(preview) } }
                runs {
                    client {
                        gameDirectory = project.file('build/compat-preview')
                        programArguments.addAll('--width', '1100', '--height', '800')
                        systemProperty('heroes.preview.compat', 'true')
                    }
                }
            }
            tasks.named('runClient') { dependsOn(tasks.named('compatPreviewClasses')) }
            apply from: rootProject.file('tools/preview-result.gradle')
        }
    }
}

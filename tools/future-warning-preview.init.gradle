// The real encounter and its operator buttons, photographed in an isolated throwaway world.
allprojects {
    plugins.withId('net.neoforged.moddev') {
        afterEvaluate {
            def preview = sourceSets.create('futureWarningPreview') {
                java.srcDir('src/uitest/java')
                compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
                runtimeClasspath += sourceSets.main.runtimeClasspath
            }
            neoForge {
                mods { heroesevolved { sourceSet(preview) } }
                runs {
                    client {
                        gameDirectory = project.file('build/future-warning-preview')
                        programArguments.addAll('--width', '1280', '--height', '800')
                        systemProperty('heroes.preview.futurewarning', 'true')
                    }
                }
            }
            tasks.named('runClient') { dependsOn(tasks.named('futureWarningPreviewClasses')) }
            apply from: rootProject.file('tools/preview-result.gradle')
        }
    }
}
